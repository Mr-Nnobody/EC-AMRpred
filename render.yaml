version: "1"
projects:
- name: My project
  environments:
  - name: Production
    services:
    - type: web
      name: ec-amrpred-server
      env: docker
      rootDir: server
      plan: starter
      healthCheckPath: /health
      envVars:
        - key: CORS_ORIGINS
          value: https://ec-amrpred.onrender.com,http://localhost:5173,http://127.0.0.1:5173
        - key: MODEL_DIR
          value: /app/fastapi_app/models
        - key: CARD_DB_PATH
          value: /app/card_database/card_db
        - key: ECOLI_DB_PATH
          value: /app/ecoli_database/ecoli_ref_db
    - type: web
      name: EC-AMRpred
      runtime: static
      rootDir: .
      repo: https://github.com/Mr-Nnobody/EC-AMRpred
      buildCommand: npm install; npm run build
      staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://ec-amrpred-server.onrender.com
      autoDeployTrigger: commit
